<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050913">
    <meta name="robots" content="index,follow">
    <title>OZLife — Mind, Body &amp; Energy</title>
    <meta
      name="description"
      content="OZLife is a native iOS wellness companion for small daily routines across Mind, Body, and Energy."
    >
    <link rel="icon" href="assets/brand/app-icon-approved.png">
    <link rel="canonical" href="https://live-oz.github.io/ozlife-experience/en/">
    <meta http-equiv="refresh" content="0; url=./en/">
    <script>
      (() => {
        const supported = ["de", "en", "es", "it"];
        let preferred = "";

        try {
          preferred = localStorage.getItem("ozlife-language") || "";
        } catch (_error) {
          // Browser storage is optional.
        }

        if (!supported.includes(preferred)) {
          const browserLanguages = navigator.languages || [navigator.language || "en"];
          preferred =
            browserLanguages
              .map((language) => language.toLowerCase().split("-")[0])
              .find((language) => supported.includes(language)) || "en";
        }

        window.location.replace(`./${preferred}/`);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #050913;
        color: #f5f7fb;
      }

      main {
        max-width: 560px;
        padding: 40px 24px;
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 20px;
      }

      .languages {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 24px;
      }

      a {
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/brand/app-icon-approved.png" alt="OZLife">
      <h1>OZLife</h1>
      <p>Choose your language · Sprache wählen · Elige tu idioma · Scegli la lingua</p>
      <nav class="languages" aria-label="Language">
        <a href="./de/" lang="de">Deutsch</a>
        <a href="./en/" lang="en">English</a>
        <a href="./es/" lang="es">Español</a>
        <a href="./it/" lang="it">Italiano</a>
      </nav>
    </main>
  </body>
</html>
