<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>OZLife</title>
    <script>
      (() => {
        const supported = ["de", "en", "es", "it"];
        const segments = window.location.pathname.split("/").filter(Boolean);
        const requestedLanguage = segments.find((segment) => supported.includes(segment));
        const browserLanguage = (navigator.language || "en").toLowerCase().split("-")[0];
        const language =
          requestedLanguage || (supported.includes(browserLanguage) ? browserLanguage : "en");
        window.location.replace(`/ozlife-experience/${language}/`);
      })();
    </script>
  </head>
  <body>
    <p><a href="/ozlife-experience/en/">Open OZLife</a></p>
  </body>
</html>
