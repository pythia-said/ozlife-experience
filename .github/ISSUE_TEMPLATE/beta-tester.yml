name: OZLife Beta-Test / Beta testing
description: Melde dich für den Beta-Test an. / Register your interest in beta testing.
title: "[Beta-Test] "
body:
  - type: markdown
    attributes:
      value: |
        Danke für dein Interesse an OZLife! / Thank you for your interest in OZLife!

        Dieses Issue ist öffentlich. Bitte teile hier keine E-Mail-Adresse, Gesundheitsdaten oder andere persönliche Informationen. Wir antworten dir im Issue und stimmen bei Bedarf einen privaten Kontaktweg ab.

        This issue is public. Please do not share your email address, health data, or other personal information here. We will reply in the issue and arrange a private contact channel if needed.

  - type: dropdown
    id: language
    attributes:
      label: Bevorzugte Sprache / Preferred language
      description: In welcher Sprache möchtest du mit uns kommunizieren? / Which language would you prefer?
      options:
        - Deutsch
        - English
        - Español
        - Italiano
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Dein Interesse / Your interest
      description: Was interessiert dich an OZLife? Eine kurze Antwort genügt. / What interests you about OZLife? A short answer is enough.
      placeholder: Mich interessiert besonders … / I am particularly interested in …

  - type: checkboxes
    id: expectations
    attributes:
      label: Vorabversion / Pre-release
      options:
        - label: Mir ist bewusst, dass OZLife noch in Entwicklung ist und ein Beta-Zugang nicht garantiert werden kann. / I understand that OZLife is still in development and beta access cannot be guaranteed.
          required: true
